name: Code quality check
run-name: Lint and typecheck
on: push
jobs: 
  lint-and-typecheck: 
    runs-on: ubuntu-latest
    steps: 
      - name: Check out repository 
        uses: actions/checkout@v4
      - name: Lint 
        uses: astral-sh/ruff-action@v4.1.0
      - name: Typecheck 
        uses: jakebailey/pyright-action@v1
        with:
          version: 1.1.414